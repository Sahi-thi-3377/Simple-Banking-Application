apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-app
  template:
    metadata:
      labels:
        app: banking-app
    spec:
      containers:
      - name: banking-container
        image: sahithi3377/simple-banking-application:v2
        ports:
        - containerPort: 5000